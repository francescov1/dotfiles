- clean: ["~"]

- shell:
    - description: Installing Homebrew
      command: command -v brew >/dev/null || { [ "$(uname)" = Darwin ] || export NONINTERACTIVE=1; /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"; }
      stderr: true
      stdout: true
      stdin: true
    - description: Updating Homebrew
      command: brew update
    - description: Installing nvm
      command: '[ -d "$HOME/.nvm" ] || curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/master/install.sh | PROFILE=/dev/null bash'
    - description: Installing oh-my-zsh
      command: '[ -d "$HOME/.oh-my-zsh" ] || sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended --keep-zshrc'
      stderr: true
      stdout: true
    - description: Installing Homebrew packages
      command: HOMEBREW_NO_INSTALL_UPGRADE=1 brew install tmux tmuxinator tmux-fingers pyenv pyenv-virtualenv uv asdf bat fzf fpp gh diff-so-fancy zsh-autosuggestions zsh-syntax-highlighting scmpuff derailed/k9s/k9s postgresql@16 ripgrep helm helmfile hashicorp/tap/terraform watch procs jj yq mosh && { [ "$(uname)" != Darwin ] || HOMEBREW_NO_INSTALL_UPGRADE=1 brew install colima docker docker-compose; }
      stderr: true
      stdout: true
      stdin: true
    - description: Installing Homebrew casks
      command: test "$(uname)" != Darwin || HOMEBREW_NO_INSTALL_UPGRADE=1 brew install --cask raycast karabiner-elements keepingyouawake cursor rectangle contexts brave-browser lulu ghostty ngrok claude-code codex || true
      stderr: true
      stdout: true
      stdin: true
    - description: Starting Colima and setting Docker context
      command: test "$(uname)" != Darwin || { colima status 2>/dev/null || colima start --runtime docker; docker context use colima; }
      stderr: true
      stdout: true
      stdin: true
    - description: Enabling Colima auto-start at login
      command: test "$(uname)" != Darwin || { brew services list | grep -q colima || brew services start colima; }
      stderr: true
      stdout: true
      stdin: true
    - description: Installing helm-diff
      command: helm plugin list 2>/dev/null | grep -q diff || helm plugin install --verify=false https://github.com/databus23/helm-diff
      stderr: true
      stdout: true
      stdin: true
    - description: Setting key repeat speeds
      command: test "$(uname)" != Darwin || { defaults write NSGlobalDomain KeyRepeat -int 2 && defaults write -g InitialKeyRepeat -int 10; }
    - description: Installing TPM (Tmux Plugin Manager)
      command: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm 2>/dev/null || (cd ~/.tmux/plugins/tpm && git pull)
      stderr: true
      stdout: true

- link:
    ~/.gitconfig: gitconfig
    ~/.tmux.conf: tmux.conf
    ~/.vimrc: vimrc
    ~/.zprofile: zprofile
    ~/.zshenv: zshenv
    ~/.zshrc: zshrc
    ~/.config/karabiner/karabiner.json:
      if: '[ `uname` = Darwin ]'
      path: karabiner.json
      force: true
    ~/.aliases: aliases
    ~/.claude/CLAUDE.md:
      path: AGENTS.md
      relink: true
    # Linux gets a copy instead (see the Moshi step). moshi-hook only accepts
    # hooks whose command is exactly its own quoted absolute path
    # ('/home/francesco/.local/bin/moshi-hook' claude-hook); $HOME, ~, bare
    # names, or guards around it are reported as out of date. That path does
    # not exist on macOS, so committing it would break every hook there.
    ~/.claude/settings.json:
      if: '[ `uname` = Darwin ]'
      path: claude-settings.json
      relink: true
    # systemd units don't read shell rc files and moshi's unit pins a minimal PATH,
    # where /usr/bin/tmux (Ubuntu's 3.4) can't talk to the Homebrew 3.8 server.
    # Fixed per-user here; /usr/bin/tmux is shared with the other users on the box.
    ~/.config/systemd/user/moshi-hook.service.d/path.conf:
      if: '[ `uname` = Linux ]'
      path: moshi-hook-path.conf
      create: true
    ~/.claude/notify-classifier-prompt.txt:
      path: claude-notify-classifier-prompt.txt
      relink: true
    ~/.codex/AGENTS.md:
      path: AGENTS.md
      relink: true
    ~/.config/opencode/AGENTS.md:
      path: AGENTS.md
      relink: true
      create: true
    ~/.config/slate/slate.json:
      if: '[ `uname` = Darwin ]'
      path: slate.json
      relink: true
    "~/Library/Application Support/Cursor/User/keybindings.json":
      if: '[ `uname` = Darwin ]'
      path: keybindings.json
      force: true
    "~/Library/Application Support/com.mitchellh.ghostty/config":
      if: '[ `uname` = Darwin ]'
      path: ghostty
      force: true

- shell:
    # Edits made to ~/.claude/settings.json on Linux are overwritten here; make them in claude-settings.json.
    # The daemon only reads pairing at startup, so it restarts after every install.
    - description: Installing Moshi hooks (Linux)
      command: test "$(uname)" != Linux || { { [ -x ~/.local/bin/moshi-hook ] || curl -fsSL https://getmoshi.app/install.sh | MOSHI_HOOK_SKIP_FIRST_RUN=1 sh; } && cp --remove-destination claude-settings.json ~/.claude/settings.json && ~/.local/bin/moshi-hook install --target claude,codex && systemctl --user daemon-reload && systemctl --user restart moshi-hook && { ~/.local/bin/moshi-hook status | grep -qE 'status:[[:space:]]+paired' || echo 'Moshi not paired. Run moshi-hook pair --token <token from Moshi app> && moshi-hook service restart'; }; }
      stderr: true
      stdout: true
    - description: Installing TPM plugins
      command: tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.tmux/plugins 2>/dev/null || tmux new-session -d -s _tpm_install; tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.tmux/plugins && ~/.tmux/plugins/tpm/bin/install_plugins; tmux kill-session -t _tpm_install 2>/dev/null || true
      stderr: true
      stdout: true
